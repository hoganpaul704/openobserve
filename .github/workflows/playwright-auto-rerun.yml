name: Playwright Auto-Rerun
run-name: Playwright Auto-Rerun - ${{ github.event.workflow_run.head_branch || 'Manual Trigger' }}
jobs:
  auto_rerun_on_failure:
    name: Auto Rerun Failed Jobs
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.run_attempt == 1)
    steps:
    - name: GERALT debug probe
      run: |
        HB_JSON='${{ toJSON(github.event.workflow_run.head_branch) }}'
        printf '%s\n' "GERALT_DBG event_name=${{ github.event_name }}"
        printf 'GERALT_DBG head_branch=%s\n' "$HB_JSON"
        printf 'GERALT_DBG run_attempt=%s\n' '${{ github.event.workflow_run.run_attempt }}'
        printf 'GERALT_DBG conclusion=%s\n' '${{ github.event.workflow_run.conclusion }}'
      continue-on-error: true
    - name: Debug - Print trigger information
      run: |
        echo "::group::Trigger Information"
        echo "Event name: ${{ github.event_name }}"
        echo "Repository: ${{ github.repository }}"

        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          echo "::notice::🔄 Auto-rerun triggered for branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Workflow run ID: ${{ github.event.workflow_run.id }}"
          echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow run attempt: ${{ github.event.workflow_run.run_attempt }}"
          echo "Workflow run status: ${{ github.event.workflow_run.status }}"
          echo "Workflow name: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Event type: ${{ github.event.workflow_run.event }}"

          # For PR events, extract PR number from head_branch (format: refs/pull/123/merge or branch name)
          if [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            echo "::notice::📋 Triggered by PR event"
            echo "PR Head Repo: ${{ github.event.workflow_run.head_repository.full_name }}"
          fi
        else
          echo "Manual run_id input: ${{ inputs.run_id }}"
        fi
        echo "::endgroup::"
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_run:
    workflows:
    - Playwright UI Tests
    types:
    - completed
    branches:
    - main
    - '**'
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID to rerun (for manual testing)
        required: true
        type: string
